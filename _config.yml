title: "Vân Anh Blog"
name: "Lê Vân Anh"
description: "Tiếng Nhật, ngữ âm học và cuộc sống tại Nhật Bản"

url: "https://vananhlehosei.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

minimal_mistakes_skin: "default"

locale: "vi-VN"

author:
  name: "Lê Vân Anh"
  bio: "Chia sẻ về tiếng Nhật, ngữ âm học và cuộc sống tại Nhật Bản."
  location: "Tokyo, Japan"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "main"

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
